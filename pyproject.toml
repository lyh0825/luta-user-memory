[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luta-user-memory"
version = "0.1.0"
description = "Luta User Memory - User Memory Management SDK"
authors = [{ name = "Luta Team" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "pydantic>=2.10.6,<3.0.0",  # 与主项目兼容
    "httpx>=0.28.0,<1.0.0",     # 与agents模块兼容
    "openai>=1.86.0,<2.0.0",    # 与其他模块兼容
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<8",
    "pytest-asyncio>=0.23.0,<0.24",
    "ruff>=0.7,<0.8",
    "mypy>=1.5.1,<2",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.hatch.build.targets.wheel]
packages = ["memobase"]
only-include = ["memobase"]

[tool.ruff.lint]
extend-select = [
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PGH", # pygrep-hooks
    "RUF", # ruff
    "E",
]